<nav class="bottom-nav">
  
  <!-- Полупрозрачный SVG-фон с вырезом -->
  <svg class="nav-bg" viewBox="0 0 390 70" preserveAspectRatio="none">
    <path d="M 0 0 
             H 138 
             C 160 0, 165 48, 195 48 
             C 225 48, 230 0, 252 0 
             H 390 
             V 70 
             H 0 
             Z" 
          fill="rgba(21, 24, 39, 0.82)" />
    
    <path d="M 0 0 
             H 138 
             C 160 0, 165 48, 195 48 
             C 225 48, 230 0, 252 0 
             H 390" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.12)" 
          stroke-width="1.5" />
  </svg>

  <!-- Парящая кнопка с сочной иконкой создания -->
  <button class="floating-add-btn" onclick="openEditor()" title="Создать">
    <!-- Трендовая иконка «Создание / Магия публикации» -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      <path d="M5 3v4"/>
      <path d="M19 17v4"/>
      <path d="M3 5h4"/>
      <path d="M17 19h4"/>
    </svg>
  </button>

  <!-- Элементы меню -->
  <div class="nav-items">
    
    <!-- 1. Лента -->
    <button class="nav-item active" onclick="switchNavTab(this, 'pageMain')">
      <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/>
        <line x1="7.5" y1="8" x2="16.5" y2="8"/>
        <line x1="7.5" y1="12" x2="16.5" y2="12"/>
        <line x1="7.5" y1="16" x2="12.5" y2="16"/>
      </svg>
      <span class="nav-text">Лента</span>
    </button>

    <!-- 2. Видео -->
    <button class="nav-item" onclick="switchNavTab(this, 'pageReels')">
      <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6.5" y="3.8" width="11" height="16.4" rx="3.8"/>
        <path d="M3 8c-1 2.2-1 5.8 0 8"/>
        <path d="M21 8c1 2.2 1 5.8 0 8"/>
        <path d="M10.2 9.8v4.4l3.8-2.2-3.8-2.2z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="nav-text">Видео</span>
    </button>

    <!-- Пропуск в сетке под центральную кнопку -->
    <div class="nav-gap"></div>

    <!-- 3. Чаты -->
    <button class="nav-item" onclick="switchNavTab(this, 'openChat')">
      <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <span class="nav-text">Чаты</span>
    </button>

    <!-- 4. Профиль -->
    <button class="nav-item" onclick="switchNavTab(this, 'pageProfile')">
      <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/>
        <circle cx="12" cy="7.5" r="4.2"/>
      </svg>
      <span class="nav-text">Профиль</span>
    </button>

  </div>
</nav>

<style>
  /* Нижнее меню на всю ширину с матовым эффектом */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 65px;
    z-index: 1000;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
  }

  .nav-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 -6px 20px rgba(0, 0, 0, 0.25));
  }

  /* Парящая градиентная кнопка */
  .floating-add-btn {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 50%, #3B82F6 100%);
    border: none;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5),
                0 0 35px rgba(99, 102, 241, 0.3);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .floating-add-btn:active {
    transform: translateX(-50%) scale(0.92);
  }

  .nav-items {
    position: relative;
    z-index: 2;
    display: flex;
    height: 100%;
    align-items: center;
    justify-content: space-around;
    max-width: 500px;
    margin: 0 auto;
  }

  .nav-item {
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: #8E8EA0;
    font-size: 11px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    flex: 1;
    height: 100%;
    cursor: pointer;
    transition: color 0.2s ease;
    outline: none;
  }

  .nav-gap {
    flex: 1.3;
    pointer-events: none;
  }

  .nav-item.active {
    color: #A78BFA;
  }

  .nav-item.active .nav-icon {
    color: #A78BFA;
  }

  .page-screen {
    padding-bottom: 86px !important;
  }
</style>

<script>
  function switchNavTab(btnEl, target) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    btnEl.classList.add('active');

    if (target === 'openChat') {
      if (typeof openGeneralChat === 'function') openGeneralChat();
    } else {
      if (typeof switchPage === 'function') switchPage(target, btnEl);
    }
  }
</script>
