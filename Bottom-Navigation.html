<style>
  /* Прямая нижняя панель */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 62px;
    z-index: 1000;
    background: rgba(21, 24, 39, 0.88);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
  }

  .nav-items {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 0 6px;
  }

  .nav-item {
    background: transparent;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: #8E8EA0;
    font-size: 11px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    flex: 1;
    height: 100%;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.15s ease;
    outline: none;
  }

  .nav-item:active {
    transform: scale(0.94);
  }

  .nav-icon {
    width: 22px;
    height: 22px;
  }

  .nav-item.active {
    color: #A78BFA;
  }

  /* Центральная градиентная кнопка */
  .nav-action-btn {
    background: transparent;
    border: none;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    height: 100%;
    cursor: pointer;
  }

  .action-btn-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 50%, #3B82F6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.45);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .nav-action-btn:active .action-btn-circle {
    transform: scale(0.92);
    box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
  }

  .page-screen {
    padding-bottom: 80px !important;
  }
</style>

<script>
  function switchNavTab(btnEl, target) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    btnEl.classList.add('active');

    if (target === 'openChat') {
      if (typeof openGeneralChat === 'function') openGeneralChat();
    } else {
      if (typeof switchPage === 'function') switchPage(target, btnEl);
    }
  }
</script>
